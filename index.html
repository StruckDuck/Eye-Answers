<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Eye</title>
<meta property="og:title" content="The Eye">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/link-preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/link-preview.png">
<style>
  @font-face{
    font-family: 'Monthoers';
    src: url('assets/monthoers.ttf') format('truetype');
    font-display: swap;
  }
  :root{
    --ink:#41504F;
    --charcoal:#2A2620;
    --focus:#C9A96E;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }

  .app{
    display:flex; flex-direction:column; align-items:center;
    gap: 14px; width: 100%; padding: 24px 16px;
  }

  .reset-btn{
    position:fixed; top:16px; right:16px; z-index:50;
    background:none; border:none; cursor:pointer;
    padding:8px 10px;
    opacity:.75; transition: opacity .2s ease;
  }
  .reset-btn:hover{ opacity:1; }
  .reset-btn span{
    font-family: 'Monthoers', Georgia, serif;
    font-size: 1.725rem;
    color: #EAE1C8;
  }

  /* ---- offering / question fields, sitting where YES/NO used to live ---- */
  .type-field{
    position:absolute;
    left:50%;
    background: #D0D0D1; /* same grey as the sclera / pupil-text */
    border: 1px solid rgba(42,38,32,.18);
    border-radius: 8px;
    padding: 6px 10px;
    width: 82%;
    height: 3.2em;
    resize: none;
    overflow: hidden;
    transform: translate(-50%, -50%);
    font-family: 'Monthoers', Georgia, serif;
    font-size: clamp(0.95rem, 4.2vw, 1.4rem);
    line-height: 1.3;
    color: var(--charcoal);
    text-align:left;
    outline:none;
    caret-color: var(--focus);
    box-shadow: 0 0 0 0 rgba(201,169,110,0);
    transition: box-shadow .15s ease;
    z-index:5;
  }
  .type-field::placeholder{ color: rgba(42,38,32,.35); }
  .type-field:focus{ box-shadow: 0 0 0 2px rgba(201,169,110,.55); }
  .offering-pos{ top: 16%; }
  .question-pos{ top: 84%; }

  /* ---- the zit: an invisible one-shot hotspot, no visual trace ---- */
  .zit-btn{
    position:absolute;
    left:83.5%; top:27.6%;
    width:20%; height:11.5%;
    transform: translate(-50%, -50%);
    background:none; border:none; padding:0; margin:0;
    cursor:pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    z-index:6;
  }

  .eye-stage{
    position:relative;
    width: min(92vw, 48vh);
    aspect-ratio: 910 / 1618;
    cursor:pointer;
  }
  .eye-stage.busy{ cursor:default; }

  .eye-backer, .eye-top{
    position:absolute; inset:0; width:100%; height:100%;
    display:block; pointer-events:none; user-select:none;
    -webkit-user-drag:none;
  }
  .eye-top{ z-index:3; }
  .eye-backer{ z-index:1; }

  .eye-content{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:center; justify-content:center;
    container-type: inline-size;
  }

  .lede-text{
    font-family: 'Monthoers', Georgia, serif;
    font-style: italic;
    color: var(--charcoal);
    opacity:.75;
    font-size: 5.2cqw;
    text-align:center;
    max-width: 68%;
    line-height:1.35;
  }

  .reveal-answer{
    font-family: 'Monthoers', Georgia, serif;
    font-weight:600;
    color: var(--charcoal);
    font-size: 7cqw;
    line-height:1.15;
    text-align:center;
    max-width: 80%;
  }

  @media (prefers-reduced-motion: reduce){
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<button class="reset-btn" id="resetBtn" aria-label="Reset">
  <span>RESET</span>
</button>

<div class="app">
  <div class="eye-stage" id="eyeStage">
    <img class="eye-backer" src="assets/eye-backer.png" alt="">
    <div class="eye-content" id="eyeContent"></div>
    <img class="eye-top" id="eyeTop" src="assets/eye-window-open.png" alt="">
    <textarea class="type-field offering-pos" id="offeringInput" rows="2" placeholder="Offering"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      enterkeyhint="done" aria-label="Offering"></textarea>
    <textarea class="type-field question-pos" id="questionInput" rows="2" placeholder="Question"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      enterkeyhint="done" aria-label="Question"></textarea>
    <button class="zit-btn" id="zitBtn" type="button" tabindex="-1" aria-label=""></button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var eyeStage = document.getElementById('eyeStage');
  var eyeTop = document.getElementById('eyeTop');
  var eyeContent = document.getElementById('eyeContent');
  var resetBtn = document.getElementById('resetBtn');
  var offeringInput = document.getElementById('offeringInput');
  var questionInput = document.getElementById('questionInput');
  var zitBtn = document.getElementById('zitBtn');

  var EYE_GIF_SRC = 'assets/eye-window.png';
  var EYE_OPEN_SRC = 'assets/eye-window-open.png';
  var EYE_CLOSED_SRC = 'assets/eye-window-closed.png';        // wiggly/zigzag shut
  var EYE_CLOSED_SMOOTH_SRC = 'assets/eye-window-closed-smooth.png'; // straight/smooth shut

  var FRAME_MS = 90, FRAME_COUNT = 13, CLOSE_AT_FRAME = 4;
  var CLOSE_DELAY = CLOSE_AT_FRAME * FRAME_MS;      // 360ms: eye is shut, safe to swap content
  var BLINK_TOTAL = FRAME_COUNT * FRAME_MS;          // 1170ms: full blink duration

  var CLOSING_GIF_SRC = 'assets/eye-window-closing.png';
  var OPENING_GIF_SRC = 'assets/eye-window-opening.png';
  var CLOSING_DURATION = 5 * FRAME_MS;   // 450ms: open -> fully shut
  var OPENING_DURATION = 7 * FRAME_MS;   // 630ms: shut -> fully open
  var REVEAL_HOLD_MS = 5000;             // how long the eye stays shut before the reveal
  var CONCENTRATE_FLICKER_MS = 3 * FRAME_MS; // ~270ms per swap while "concentrating"

  // the fixed offering phrase. this is what silently plays out on screen,
  // one character per real keystroke, while the zit is active and the
  // operator's real typing is being captured as the secret answer instead.
  var FILLER = 'Grant me an answer and in return I will offer you';


  // ============================================================
  // state
  // ============================================================
  var state = { busy:false };

  function freshCapture(){
    return { active:false, locked:false, fillerPos:0, buffer:'' };
  }
  var capture = freshCapture();

  // ============================================================
  // the offering field: normal typing by default. the zit flips it
  // into capture mode, where real keystrokes are hidden in `capture.buffer`
  // and the visible text instead advances through FILLER.
  // ============================================================
  function advanceFiller(){
    if (capture.fillerPos < FILLER.length){
      offeringInput.value += FILLER[capture.fillerPos];
      capture.fillerPos += 1;
    }
    // filler exhausted: nothing further shows, but the keystroke that got
    // us here has already been logged into capture.buffer by the caller
  }

  offeringInput.addEventListener('beforeinput', function(e){
    if (!capture.active) return; // normal mode: let the browser do its thing

    e.preventDefault();

    if (e.inputType === 'insertText' || e.inputType === 'insertReplacementText' || e.inputType === 'insertFromPaste'){
      var text = e.data || '';
      for (var i = 0; i < text.length; i++){
        capture.buffer += text[i];
        advanceFiller();
      }
    } else if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward'){
      // backspace also counts as a keystroke: it removes from the hidden
      // answer, but the visible filler still only ever moves forward
      capture.buffer = capture.buffer.slice(0, -1);
      advanceFiller();
    }
    // anything else (line breaks, IME composition, etc.) is simply ignored
  });

  // don't let taps into either field also register as a tap on the eye
  offeringInput.addEventListener('click', function(e){ e.stopPropagation(); });
  questionInput.addEventListener('click', function(e){ e.stopPropagation(); });

  // ============================================================
  // the zit: a strict one-shot toggle.
  // tap 1: enter capture mode.
  // tap 2: exit capture mode. if anything was actually captured, the zit
  //        locks forever. if nothing was captured, it stays live so the
  //        operator gets another chance.
  // ============================================================
  // the zit must never take keyboard focus away from whatever field the
  // operator is mid-sentence in -- otherwise tapping it dismisses the
  // on-screen keyboard and kills capture mode along with it. preventing
  // default on mousedown (the standard, well-proven trick for this) stops
  // the focus steal; the actual toggle runs on plain "click", which is
  // the one event type iOS Safari reliably fires for a tap like this.
  // (note: this must stay mousedown-only -- preventDefault on touchstart
  // cancels the synthetic mousedown/click chain entirely on iOS Safari)
  zitBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });

  zitBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (capture.locked) return;

    if (!capture.active){
      capture.active = true;
      // pick up wherever the visible offering text already is, so the
      // operator can start typing the phrase manually and trigger the
      // zit at any point
      capture.fillerPos = Math.min(offeringInput.value.length, FILLER.length);
    } else {
      capture.active = false;
      if (capture.buffer.length > 0){
        capture.locked = true;
      }
    }
  });

  // ============================================================
  // instructions, shown inside the eye from the very start
  // ============================================================
  function renderInstructions(){
    eyeContent.innerHTML = '';
    var el = document.createElement('div');
    el.className = 'lede-text';
    el.innerHTML = 'Type an offering.<br>Type a question.<br>Tap the eye for your answer.';
    eyeContent.appendChild(el);
  }

  // ============================================================
  // the reveal: just the answer itself, already formed, centered in
  // the eye the moment it opens
  // ============================================================
  function playAnswerReveal(){
    var answer = (capture.buffer || '').trim();
    if (!answer) answer = '\u2026'; // nothing was ever captured -- fall back rather than break

    var el = document.createElement('div');
    el.className = 'reveal-answer';
    el.textContent = answer.toUpperCase();
    eyeContent.appendChild(el);
  }

  // ============================================================
  // tap the eye: close, "concentrate" (flicker between the wiggly and
  // smooth shut shapes) for REVEAL_HOLD_MS, open into the reveal
  // ============================================================
  var concentrateTimer = null;
  function clearConcentrateFlicker(){
    if (concentrateTimer){ clearInterval(concentrateTimer); concentrateTimer = null; }
  }
  function playConcentrateFlicker(totalMs, intervalMs){
    clearConcentrateFlicker();
    var elapsed = 0;
    var onWiggly = true; // closing animation already ends on the wiggly shape
    eyeTop.src = EYE_CLOSED_SRC;
    concentrateTimer = setInterval(function(){
      elapsed += intervalMs;
      if (elapsed >= totalMs){
        clearConcentrateFlicker();
        eyeTop.src = EYE_CLOSED_SRC; // always land on wiggly, whatever the parity
        return;
      }
      onWiggly = !onWiggly;
      eyeTop.src = onWiggly ? EYE_CLOSED_SRC : EYE_CLOSED_SMOOTH_SRC;
    }, intervalMs);
  }

  function closeHoldOpenThenReveal(){
    if (state.busy) return;
    clearIdleBlink();
    state.busy = true;
    eyeStage.classList.add('busy');

    eyeTop.src = CLOSING_GIF_SRC;

    setTimeout(function(){
      // eye is now shut -- safe to clear the instructions with nothing visible
      eyeContent.innerHTML = '';
      playConcentrateFlicker(REVEAL_HOLD_MS, CONCENTRATE_FLICKER_MS);
    }, CLOSING_DURATION);

    setTimeout(function(){
      clearConcentrateFlicker();
      eyeTop.src = OPENING_GIF_SRC;
      playAnswerReveal(); // built while still shut, sitting there the instant the lid opens
    }, CLOSING_DURATION + REVEAL_HOLD_MS);

    setTimeout(function(){
      eyeTop.src = EYE_OPEN_SRC;
      eyeStage.classList.remove('busy');
      state.busy = false;
      // brief pause so the reveal registers before ambient blinking resumes
      setTimeout(scheduleIdleBlink, 1500);
    }, CLOSING_DURATION + REVEAL_HOLD_MS + OPENING_DURATION);
  }

  eyeStage.addEventListener('click', closeHoldOpenThenReveal);

  // ============================================================
  // ambient idle blinks -- purely cosmetic, randomized timing
  // ============================================================
  var idleBlinkTimer = null;
  function clearIdleBlink(){
    if (idleBlinkTimer){ clearTimeout(idleBlinkTimer); idleBlinkTimer = null; }
  }
  function scheduleIdleBlink(){
    clearIdleBlink();
    var delay = 2500 + Math.random() * 4000;
    idleBlinkTimer = setTimeout(function(){
      if (state.busy) return;
      state.busy = true;
      eyeStage.classList.add('busy');
      eyeTop.src = EYE_GIF_SRC;
      setTimeout(function(){
        eyeTop.src = EYE_OPEN_SRC;
        eyeStage.classList.remove('busy');
        state.busy = false;
        scheduleIdleBlink();
      }, BLINK_TOTAL);
    }, delay);
  }

  // ============================================================
  // reset
  // ============================================================
  function resetAll(){
    clearIdleBlink();
    clearConcentrateFlicker();
    state.busy = true;
    eyeStage.classList.add('busy');
    eyeTop.src = EYE_GIF_SRC;

    setTimeout(function(){
      // eye is shut here -- swap everything back to fresh with nothing visible
      eyeTop.src = EYE_CLOSED_SRC;
      offeringInput.value = '';
      questionInput.value = '';
      capture = freshCapture();
      renderInstructions();
    }, CLOSE_DELAY);

    setTimeout(function(){
      eyeTop.src = EYE_OPEN_SRC;
      eyeStage.classList.remove('busy');
      state.busy = false;
      scheduleIdleBlink();
    }, BLINK_TOTAL);
  }
  resetBtn.addEventListener('click', resetAll);

  // ============================================================
  // init
  // ============================================================
  renderInstructions();
  scheduleIdleBlink();
})();
</script>
</body>
</html>
